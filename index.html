    h('div', { class: 'bottombar' },
      h('button', { class: 'btn', style: { flex: '0 0 auto' }, onclick: () => { flushSaves(); go('/r/' + encodeURIComponent(rep.id) + '/struttura'); } }, icon('layers')),
      h('button', { class: 'btn acc', onclick: () => { flushSaves(); exportSheet(rep); } }, icon('pdf'), 'Genera report e pacchetto')),
  ];
}
function shortTitle(t) {
  const s = String(t).replace(/\s*\(.*?\)\s*/g, ' ').trim();
  return s.length > 22 ? s.slice(0, 20) + '…' : s;
}
function copyAll(rep, section) {
  for (const s of rep.tpl.sections) {
    if (section && s.id !== section.id) continue;
    for (const it of s.items) {
      if (it.single) continue;
      const v = rep.values[it.id];
      if (v && String(v.a || '').trim() && !String(v.p || '').trim()) v.p = v.a;
    }
  }
  rep.updatedAt = Date.now();
  scheduleSave('reports', rep, 0);
}
async function syncFromTemplate(rep, base) {
  const ok = await ask('Aggiornare la struttura?', 'Le voci e le categorie di questo report verranno sostituite con quelle del modello «' + base.name +
    '». I valori già inseriti nelle voci presenti in entrambi vengono mantenuti.', [{ label: 'Annulla', value: false }, { label: 'Aggiorna', value: true, cls: 'pri' }]);
  if (!ok) return;
  const st = clone(base);
  delete st.createdAt; delete st.updatedAt;
  for (const f of st.headerFields) if (rep.header[f.id] === undefined) rep.header[f.id] = '';
  rep.tpl = st;
  rep.updatedAt = Date.now();
  await DB.put('reports', rep);
  render();
  toast('Struttura aggiornata');
}

/* --- singola voce di controllo --- */
function itemEl(rep, it, prev, onChange) {
  const v = rep.values[it.id] || (rep.values[it.id] = { a: '', p: '', n: '' });
  const wrap = h('div', { class: 'item' });
  const warn = h('div', { class: 'warn', style: { display: 'none' } });
  let noteOpen = !!v.n;
  const noteIn = autosize(h('textarea', { class: 'in note-in', placeholder: 'Note / dettagli', value: v.n || '' }));
  noteIn.addEventListener('input', () => { v.n = noteIn.value; noteBtn.classList.toggle('on', !!v.n); onChange(); });
  const noteBox = h('div', { style: { display: noteOpen ? '' : 'none' } }, noteIn);
  const noteBtn = h('button', {
    class: 'ib' + (v.n ? ' on' : ''), title: 'Nota', onclick: () => {
      noteOpen = !noteOpen; noteBox.style.display = noteOpen ? '' : 'none';
      if (noteOpen) setTimeout(() => noteIn.focus(), 50);
    },
  }, icon('note', 'sm'));

  let ref = it.ref || '';
  if (!ref && it.type === 'number') ref = rangeText(it);
  let prevEl = null;
  if (prev) {
    const pv = prev.values[it.id];
    if (pv && (String(pv.a || '').trim() || String(pv.p || '').trim())) {
      prevEl = h('div', { class: 'prev' }, 'Prec. ' + fmtDate(repDate(prev)) + ': ',
        h('b', null, displayVal(it, pv.a) || '—'), it.single ? null : [' → ', h('b', null, displayVal(it, pv.p) || '—')]);
    }
  }
  wrap.appendChild(h('div', { class: 'item-top' },
    it.num ? h('span', { class: 'num' }, it.num) : null,
    h('div', { class: 'item-lbl' }, it.label, ref ? h('div', { class: 'item-ref' }, ref) : null, prevEl),
    noteBtn));

  const evaluate = () => {
    const aBad = isAlert(it, v.a), pBad = !it.single && isAlert(it, v.p);
    wrap.classList.toggle('alert', aBad || pBad);
    if (it.type === 'number' && (aBad || pBad)) {
      warn.style.display = '';
      warn.innerHTML = '';
      add(warn, [icon('alert', 'sm'), 'Fuori riferimento' + (rangeText(it) ? ' (' + rangeText(it) + ')' : '')]);
    } else warn.style.display = 'none';
  };

  if (it.type === 'number' || it.type === 'text') {
    let lastFocus = 'a';
    const mk = key => {
      const inp = h(it.type === 'text' ? 'textarea' : 'input', {
        class: 'in' + (it.type === 'text' ? ' tv' : ''), rows: it.type === 'text' ? 1 : null, value: v[key] || '', autocomplete: 'off', enterkeyhint: 'next',
        inputmode: it.type === 'number' ? 'decimal' : null,
        placeholder: it.type === 'number' && it.unit ? it.unit : '',
      });
      const paint = () => {
        const bad = isAlert(it, v[key]);
        inp.classList.toggle('bad', bad);
        inp.classList.toggle('ok', it.type === 'number' && !bad && !isNaN(parseNum(v[key])) && (hasNum(it.min) || hasNum(it.max)));
      };
      inp.addEventListener('input', () => { v[key] = inp.value; paint(); evaluate(); onChange(); });
      inp.addEventListener('focus', () => { lastFocus = key; });
      paint();
      if (it.type !== 'number') { autosize(inp, 46); return { inp, el: inp }; }
      const pm = h('button', {
        class: 'cp', style: { position: 'absolute', right: '2px', top: '0', width: '32px', fontSize: '17px', fontWeight: '700' }, title: 'Cambia segno',
        onclick: () => {
          const s = inp.value.trim();
          inp.value = s.startsWith('-') ? s.slice(1) : '-' + s;
          inp.dispatchEvent(new Event('input'));
          inp.focus();
        },
      }, '±');
      inp.style.paddingRight = '34px';
      return { inp, el: h('div', { style: { position: 'relative' } }, inp, pm) };
    };
    const A = mk('a');
    if (it.single) {
      wrap.appendChild(h('div', { class: 'vals single' }, h('label', null, h('span', null, 'Valore'), A.el)));
    } else {
      const P = mk('p');
      const cp = h('button', {
        class: 'cp', title: 'Copia arrivo in partenza',
        onclick: () => { P.inp.value = A.inp.value; P.inp.dispatchEvent(new Event('input')); toast('Copiato in partenza'); },
      }, icon('copy'));
      wrap.appendChild(h('div', { class: 'vals' },
        h('label', null, h('span', null, 'Arrivo'), A.el), cp, h('label', null, h('span', null, 'Partenza'), P.el)));
    }
    if (it.type === 'text' && (it.options || []).length) {
      wrap.appendChild(h('div', { class: 'chips', style: { marginTop: '8px' } }, it.options.map(o => h('button', {
        class: 'chip sug', onclick: () => {
          const target = it.single ? 'a' : lastFocus;
          const el = wrap.querySelectorAll('.vals .in')[target === 'p' ? 1 : 0];
          el.value = o; el.dispatchEvent(new Event('input'));
          if (target === 'a' && !it.single) lastFocus = 'p';
        },
      }, o))));
    }
  } else {
    // scelta / sì-no
    const opts = it.type === 'yesno' ? (it.options && it.options.length ? it.options : YN) : (it.options || []);
    const rows = {};
    const mkRow = (key, label) => {
      const chips = h('div', { class: 'chips' });
      const paint = () => {
        chips.innerHTML = '';
        for (const o of opts) {
          const on = norm(v[key]) === norm(o);
          const bad = on && isAlert(it, o);
          chips.appendChild(h('button', {
            class: 'chip' + (on ? ' on' : '') + (bad ? ' bad' : ''),
            onclick: () => { v[key] = on ? '' : o; paint(); evaluate(); onChange(); },
          }, on ? icon('check', 'sm') : null, o));
        }
        if (v[key] && !opts.some(o => norm(o) === norm(v[key]))) {
          chips.appendChild(h('button', { class: 'chip on', onclick: () => { v[key] = ''; paint(); evaluate(); onChange(); } }, v[key]));
        }
      };
      paint();
      rows[key] = paint;
      return h('div', { class: 'chiprow' }, h('span', null, label), chips);
    };
    if (it.single) wrap.appendChild(mkRow('a', 'Valore'));
    else {
      wrap.appendChild(mkRow('a', 'Arrivo'));
      wrap.appendChild(mkRow('p', 'Partenza'));
      wrap.appendChild(h('div', { class: 'chiprow' }, h('span'), h('button', {
        class: 'chip sug cpx', onclick: () => { v.p = v.a; rows.p(); evaluate(); onChange(); },
      }, icon('copy', 'sm'), 'Uguale all\'arrivo')));
    }
  }
  wrap.append(warn, noteBox, itemPhotoStrip(rep, it, onChange));
  evaluate();
  return wrap;
}

/* --- foto del report --- */
function phaseLabel(ph) { return ph === 'prima' ? 'Prima' : ph === 'dopo' ? 'Dopo' : ''; }
function photoAutoName(rep, p) {
  if (!p.itemId) return 'Generale';
  const it = findItem(rep, p.itemId);
  const base = it ? (it.num ? it.num + ' - ' : '') + it.label : 'Controllo';
  return base + (p.phase ? ' - ' + p.phase.toUpperCase() : '');
}
function photoCaption(rep, p) {
  if (p.caption) return p.caption;
  if (!p.itemId) return 'Foto generale';
  const it = findItem(rep, p.itemId);
  return (it ? (it.num ? it.num + '. ' : '') + it.label : 'Controllo') + (p.phase ? ' – ' + phaseLabel(p.phase) : '');
}
async function storePhotos(rep, list, itemId, phase) {
  for (const it of list) {
    const id = 'p' + uid();
    await DB.put('photos', { id, reportId: rep.id, blob: it.blob, w: it.w, h: it.h, createdAt: Date.now() });
    rep.photos.push({ id, itemId: itemId || null, phase: phase || '', caption: '', include: true });
  }
}

      }), h('span', null, 'Allega al report PDF / JPEG')),

function itemPhotoStrip(rep, it, onChange) {
  const box = h('div', { class: 'iph' });

    const mine = rep.photos.filter(p => p.itemId === it.id);
    const btn = (phase, label) => {
      const n = mine.filter(p => p.phase === phase).length;
      return h('button', { class: 'chip phb', onclick: () => add(phase) }, icon('camera', 'sm'), label, n ? h('span', { class: 'phn' }, n) : null);
    };
    const row = h('div', { class: 'iph-row' }, it.single ? btn('', 'Foto') : [btn('prima', 'Foto prima'), btn('dopo', 'Foto dopo')]);
    const thumbs = h('div', { class: 'iph-thumbs' });
    for (const p of mine) {
      const rec = await DB.get('photos', p.id);
      if (!rec) continue;
      const u = URL.createObjectURL(rec.blob);
      objectUrls.push(u);
      thumbs.appendChild(h('div', { class: 'ph sm' + (p.include === false ? ' off' : ''), onclick: () => photoSheet(rep, p, u, onChange, paint) },
        h('img', { src: u, alt: photoCaption(rep, p) }),
        p.phase ? h('span', { class: 'n' }, phaseLabel(p.phase)) : null,
        p.include === false ? h('span', { class: 'ex' }, 'non nel PDF') : null));

        h('button', { class: 'btn grow', onclick: () => addPhotos('gallery') }, icon('image'), 'Dalla galleria')),
      grid));
}
function orderedPhotos(rep) {
  const out = [];
  const used = new Set();
  for (const s of rep.tpl.sections) for (const it of s.items) {
    for (const ph of ['prima', 'dopo', '']) {
      for (const p of rep.photos) if (p.itemId === it.id && (p.phase || '') === ph && !used.has(p)) { out.push(p); used.add(p); }
    }
  }
  for (const p of rep.photos) if (!used.has(p)) { out.push(p); used.add(p); }
  return out;
}
async function loadPhotos(rep, onlyIncluded) {
  const out = [];
  const names = {};
  for (const p of orderedPhotos(rep)) {
    const rec = await DB.get('photos', p.id);
    if (!rec) continue;
    let base = spName(photoAutoName(rep, p));
    names[base] = (names[base] || 0) + 1;
    const fileName = (names[base] > 1 ? base + ' ' + names[base] : base) + '.jpg';
    if (onlyIncluded && p.include === false) continue;
    out.push({ id: p.id, blob: rec.blob, w: rec.w, h: rec.h, caption: photoCaption(rep, p), itemId: p.itemId, include: p.include !== false, fileName });
  }
  return out;
}

        group('Cosa vuoi creare', fmtChips),
        h('div', { class: 'small muted', style: { marginTop: '6px' } }, desc),

        nPh ? h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: o.photos, onchange: e => { o.photos = e.target.checked; } }),
          h('span', null, 'Allega le foto scelte al report (' + nInc + ' di ' + nPh + ')')) : null,
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: o.summary, onchange: e => { o.summary = e.target.checked; } }), h('span', null, 'Riepilogo anomalie nella prima pagina')),
        h('div', { class: 'btns' },

      flushSaves();
      const b = busy('Creo il PDF…');
      let saved = [];

        await nextFrame();
        const all = await loadPhotos(rep, false);
        const inPdf = o.photos ? all.filter(p => p.include) : [];
        const res = await buildReportPdf(rep, S.settings, {

        });

          saved.push({ name: base + '.pdf', kind: 'pdf', mime: 'application/pdf', uri: rp.uri, blob: new Blob([res.bytes], { type: 'application/pdf' }) });
        } else {
          b.done();

function fileOf(f) { return new File([f.blob], f.name, { type: f.mime }); }
function webShareable(f) {
  try { return !!(f.blob && f.kind !== 'zip' && navigator.canShare && navigator.canShare({ files: [fileOf(f)] })); } catch (e) { return false; }
}
async function webShare(list, title) {
  try { await navigator.share({ files: list.map(fileOf), title }); } catch (e) { if (e && e.name !== 'AbortError') toast('Condivisione non riuscita'); }
}

const ROLE_LABEL = { plant: 'Impianto', date: 'Data intervento', tech: 'Tecnico', keep: 'Riportato al prossimo intervento', '': '' };
function moveBtns(arr, i, done) {
  return [
    h('button', { class: 'ib', disabled: i === 0, onclick: () => { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); done(); } }, icon('up', 'sm')),
    h('button', { class: 'ib', disabled: i === arr.length - 1, onclick: () => { arr.splice(i + 1, 0, arr.splice(i, 1)[0]); done(); } }, icon('down', 'sm')),
  ];
}
function itemSummary(it) {
  const p = [TYPE_LABEL[it.type] || it.type];
  if (it.type === 'number') { const r = rangeText(it); if (r) p.push(r); else if (it.unit) p.push(it.unit); }
  if ((it.type === 'choice' || it.type === 'text') && it.options.length) p.push(it.options.slice(0, 3).join(' / ') + (it.options.length > 3 ? '…' : ''));
  if ((it.alert || []).length) p.push('anomalia se ' + it.alert.join(' o '));
  if (it.single) p.push('valore unico');
  return p.join(' · ');
}
function nextNum(obj) {
  let m = 0;
  for (const s of obj.sections) for (const it of s.items) { const n = parseInt(it.num, 10); if (!isNaN(n) && n > m) m = n; }
  return m + 1;
}
async function saveAsTemplate(rep, base) {
  if (base) {
    const ok = await ask('Sostituire il modello?', 'Il modello «' + base.name + '» prenderà la struttura di questo report. I report già compilati non cambiano.', [{ label: 'Annulla', value: false }, { label: 'Sostituisci', value: true, cls: 'pri' }]);
    if (!ok) return;
    const t = Object.assign(clone(rep.tpl), { id: base.id, createdAt: base.createdAt, updatedAt: Date.now() });
    Object.assign(base, t);
    await DB.put('templates', base);
    toast('Modello aggiornato');

    const name = await prompt2('Nuovo modello', 'Nome del modello', rep.tpl.name + ' (copia)');

function editItem(obj, sec, it, save, repaint, isNew) {
  const d = clone(it);
  sheet(s => {
    const dyn = h('div');
    const num = h('input', { class: 'in', value: d.num });
    const lab = autosize(h('textarea', { class: 'in', value: d.label, placeholder: 'Es. Pressione rampa lavaggio 1 (SP1)', style: { minHeight: '46px' } }));
    const ref = h('input', { class: 'in', value: d.ref, placeholder: 'Es. 2,1 - 3 bar' });
    const type = h('select', { class: 'in' }, Object.keys(TYPE_LABEL).map(k => h('option', { value: k }, TYPE_LABEL[k])));
    type.value = d.type;
    num.oninput = () => { d.num = num.value; };
    lab.oninput = () => { d.label = lab.value; };
    ref.oninput = () => { d.ref = ref.value; };
    type.onchange = () => {
      d.type = type.value;
      if (d.type === 'yesno') { d.options = YN.slice(); d.alert = []; }
      else if (d.type === 'choice' && (!d.options.length || d.options.join() === YN.join())) { d.options = []; d.alert = []; }
      else if (d.type === 'number' || d.type === 'text') d.alert = [];
      paintDyn();
    };
    function paintDyn() {
      dyn.innerHTML = '';
      if (d.type === 'number') {
        const u = h('input', { class: 'in', value: d.unit || '', placeholder: 'bar, mbar, ppm…' });
        const mn = h('input', { class: 'in', inputmode: 'decimal', value: hasNum(d.min) ? fmtNum(+d.min) : '' });
        const mx = h('input', { class: 'in', inputmode: 'decimal', value: hasNum(d.max) ? fmtNum(+d.max) : '' });
        u.oninput = () => { d.unit = u.value.trim(); };
        mn.oninput = () => { const n = parseNum(mn.value); d.min = isNaN(n) ? null : n; };
        mx.oninput = () => { const n = parseNum(mx.value); d.max = isNaN(n) ? null : n; };
        add(dyn, [
          field('Unità di misura', u),
          h('div', { class: 'grid2' }, field('Minimo accettabile', mn), field('Massimo accettabile', mx)),
          h('div', { class: 'small muted', style: { marginTop: '6px' } }, 'I valori fuori da questo intervallo vengono evidenziati in rosso nell\'app e nel PDF. Lascia vuoto se non serve.'),
        ]);
      } else {
        const ta = autosize(h('textarea', { class: 'in', value: (d.options || []).join('\n'), placeholder: 'Una opzione per riga' }));
        const alertBox = h('div');
        const paintAlert = () => {
          alertBox.innerHTML = '';
          if (d.type === 'text' || !d.options.length) return;
          alertBox.appendChild(group('Evidenzia come anomalia quando il valore è',
            h('div', { class: 'chips' }, d.options.map(o => {
              const on = d.alert.includes(o);
              return h('button', {
                class: 'chip' + (on ? ' on bad' : ''),
                onclick: () => { d.alert = on ? d.alert.filter(x => x !== o) : d.alert.concat([o]); paintAlert(); },
              }, o);
            }))));
        };
        ta.oninput = () => {
          d.options = ta.value.split('\n').map(x => x.trim()).filter(Boolean);
          d.alert = d.alert.filter(a => d.options.includes(a));
          paintAlert();
        };
        add(dyn, [
          field(d.type === 'text' ? 'Suggerimenti rapidi (facoltativi, uno per riga)' : 'Opzioni (una per riga)', ta),
          alertBox,
        ]);
        paintAlert();
      }
      dyn.appendChild(h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: d.single, onchange: e => { d.single = e.target.checked; } }),
        h('span', null, 'Valore unico (senza arrivo / partenza)')));
    }
    paintDyn();
    if (isNew) setTimeout(() => lab.focus(), 300);
    return [
      h('h2', null, isNew ? 'Nuova voce' : 'Modifica voce'),
      h('div', { class: 'sub' }, sec.title),
      h('div', { style: { display: 'grid', gridTemplateColumns: '78px 1fr', gap: '0 10px' } }, field('N.', num), field('Tipo di valore', type)),
      field('Voce di controllo', lab),
      field('Riferimento (testo mostrato nel report)', ref),
      dyn,
      h('div', { class: 'btns', style: { marginTop: '18px' } },
        !isNew ? h('button', {
          class: 'btn red', style: { flex: '0 0 auto' }, onclick: async () => {
            const ok = await ask('Eliminare la voce?', it.label, [{ label: 'Annulla', value: false }, { label: 'Elimina', value: true, cls: 'red' }]);
            if (!ok) return;
            sec.items.splice(sec.items.indexOf(it), 1); save(); s.close(); repaint();
          },
        }, icon('trash')) : null,
        h('button', { class: 'btn', onclick: () => s.close() }, 'Annulla'),
        h('button', {
          class: 'btn pri', onclick: () => {
            if (!d.label.trim()) { toast('Scrivi il nome della voce'); lab.focus(); return; }
            d.label = d.label.trim();
            if (isNew) sec.items.push(d); else Object.assign(it, d);
            save(); s.close(); repaint();
          },
        }, 'Salva')),
    ];
  });
}

function editHeaderField(obj, f, save, repaint, isNew) {
  const d = clone(f);
  sheet(s => {
    const dyn = h('div');
    const lab = h('input', { class: 'in', value: d.label });
    lab.oninput = () => { d.label = lab.value; };
    const type = h('select', { class: 'in' }, Object.keys(HTYPE_LABEL).map(k => h('option', { value: k }, HTYPE_LABEL[k])));

    const role = h('select', { class: 'in' },
      h('option', { value: '' }, 'Nessuno'),
      h('option', { value: 'plant' }, 'Impianto (nome file, storico, suggerimenti)'),
      h('option', { value: 'date' }, 'Data intervento'),
      h('option', { value: 'tech' }, 'Tecnico (precompilato dalle impostazioni)'),
      h('option', { value: 'keep' }, 'Riporta il valore al prossimo intervento'));
    role.value = d.role || '';
    role.onchange = () => { d.role = role.value; };
    type.onchange = () => { d.type = type.value; paintDyn(); };
    function paintDyn() {
      dyn.innerHTML = '';
      if (d.type === 'choice') {
        const ta = autosize(h('textarea', { class: 'in', value: (d.options || []).join('\n'), placeholder: 'Una per riga' }));
        ta.oninput = () => { d.options = ta.value.split('\n').map(x => x.trim()).filter(Boolean); };

      }
      if (d.type === 'date') dyn.appendChild(h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: d.def === 'today', onchange: e => { d.def = e.target.checked ? 'today' : ''; } }), h('span', null, 'Precompila con la data di oggi')));
      else if (d.type === 'time') dyn.appendChild(h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: d.def === 'now', onchange: e => { d.def = e.target.checked ? 'now' : ''; } }), h('span', null, 'Precompila con l\'ora attuale')));
      else {
        const dv = h('input', { class: 'in', value: d.def && d.def !== 'today' && d.def !== 'now' ? d.def : '' });
        dv.oninput = () => { d.def = dv.value; };
        dyn.appendChild(field('Valore predefinito (facoltativo)', dv));
      }
    }
    paintDyn();
    return [
      h('h2', null, isNew ? 'Nuovo campo' : 'Modifica campo'),
      field('Etichetta', lab),
      field('Tipo', type),
      field('Ruolo', role),
      dyn,
      h('div', { class: 'btns', style: { marginTop: '18px' } },
        isNew ? null : h('button', {
          class: 'btn red', style: { flex: '0 0 auto' }, onclick: async () => {
            const ok = await ask('Eliminare il campo?', f.label, [{ label: 'Annulla', value: false }, { label: 'Elimina', value: true, cls: 'red' }]);
            if (!ok) return;
            obj.headerFields.splice(obj.headerFields.indexOf(f), 1); save(); s.close(); repaint();
          },
        }, icon('trash')),
        h('button', { class: 'btn', onclick: () => s.close() }, 'Annulla'),
        h('button', {
          class: 'btn pri', onclick: () => {
            d.label = d.label.trim() || 'Campo';
            if (d.role && d.role !== 'keep') for (const o of obj.headerFields) if (o !== f && o.role === d.role) o.role = '';
            Object.assign(f, d); if (isNew) obj.headerFields.push(f); save(); s.close(); repaint();
          },
        }, 'Salva')),
    ];
  });

function editPlant(name) {
  const existing = name ? plantByName(name) : null;

    f.oninput = () => { folderTouched = true; };
    const nRep = name ? S.reports.filter(r => norm(repPlant(r)) === norm(name)).length : 0;
    return [
      h('h2', null, existing ? 'Modifica impianto' : 'Nuovo impianto'),

      h('div', { class: 'btns', style: { marginTop: '18px' } },

            S.plants = S.plants.filter(p => p !== existing);

        h('button', { class: 'btn', onclick: () => s.close() }, 'Annulla'),
        h('button', {
          class: 'btn pri', onclick: async () => {
            const nn = n.value.trim();

            if (other && other !== existing) { toast('Esiste già un impianto con questo nome'); return; }
            const folder = spName(f.value.trim() || nn);
            if (existing) {
              const old = existing.name;
              existing.name = nn; existing.folder = folder;
              if (norm(old) !== norm(nn)) {
                for (const r of S.reports) {
                  if (norm(repPlant(r)) !== norm(old)) continue;
                  const fld = hdrField(r.tpl, 'plant');
                  if (fld) { r.header[fld.id] = nn; await DB.put('reports', r); }
                }
              }
            } else if (name) {
              S.plants.push({ id: 'pl' + uid(), name: nn, folder, createdAt: Date.now() });
            } else {
              S.plants.push({ id: 'pl' + uid(), name: nn, folder, createdAt: Date.now() });
            }
            await DB.setSetting('plants', S.plants);
            s.close();
            toast('Impianto salvato');
            go('/p/' + encodeURIComponent(nn));
          },

    ];

function findItem(rep, id) {
  for (const s of rep.tpl.sections) for (const it of s.items) if (it.id === id) return it;
  return null;
}
function historyChart(rows, it) {
  const pts = [];
  rows.forEach((x, i) => {
    const a = parseNum(x.v.a), pp = parseNum(x.v.p);
    pts.push({ i, a: isNaN(a) ? null : a, p: isNaN(pp) ? null : pp, d: fmtDate(repDate(x.r)).slice(0, 5) });
  });
  const vals = [];
  pts.forEach(q => { if (q.a != null) vals.push(q.a); if (q.p != null) vals.push(q.p); });
  if (!vals.length) return h('div', { class: 'muted small', style: { marginTop: '12px' } }, 'Nessun valore numerico registrato per questa voce.');
  if (hasNum(it.min)) vals.push(+it.min);
  if (hasNum(it.max)) vals.push(+it.max);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  const W = 340, Hh = 190, L = 40, R = 10, T = 12, B = 30;
  const n = pts.length;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const Y = v => T + (hi - v) / (hi - lo) * (Hh - T - B);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" class="chart" xmlns="http://www.w3.org/2000/svg" font-family="Roboto,sans-serif">';
  if (hasNum(it.min) || hasNum(it.max)) {
    const y1 = Y(hasNum(it.max) ? +it.max : hi), y2 = Y(hasNum(it.min) ? +it.min : lo);
    svg += '<rect x="' + L + '" y="' + y1 + '" width="' + (W - L - R) + '" height="' + (y2 - y1) + '" fill="#2E7D32" opacity=".08"/>';
  }
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, yy = Y(v);
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#E1E7EA"/>';
    svg += '<text x="' + (L - 5) + '" y="' + (yy + 3.5) + '" font-size="10" text-anchor="end" fill="#7D8B91">' + fmtNum(+v.toPrecision(3)) + '</text>';
  }
  const path = (key, color, dash) => {
    let d = '', started = false;
    pts.forEach(q => { if (q[key] == null) return; d += (started ? 'L' : 'M') + X(q.i) + ' ' + Y(q[key]) + ' '; started = true; });
    let s = d ? '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.2"' + (dash ? ' stroke-dasharray="5 4"' : '') + '/>' : '';
    pts.forEach(q => {
      if (q[key] == null) return;
      const bad = isAlert(it, q[key]);
      s += '<circle cx="' + X(q.i) + '" cy="' + Y(q[key]) + '" r="3.6" fill="' + (bad ? '#C62828' : color) + '" stroke="#fff" stroke-width="1.2"/>';
    });
    return s;
  };
  svg += path('a', '#0B4F5C') + path('p', '#F2A93B', true);
  const step = Math.max(1, Math.ceil(n / 6));
  pts.forEach(q => { if (q.i % step === 0 || q.i === n - 1) svg += '<text x="' + X(q.i) + '" y="' + (Hh - 10) + '" font-size="10" text-anchor="' + (n > 1 && q.i === n - 1 ? 'end' : n > 1 && q.i === 0 ? 'start' : 'middle') + '" fill="#7D8B91">' + q.d + '</text>'; });
  svg += '</svg>';
  return h('div', null, h('div', { html: svg }),
    h('div', { class: 'legend' }, h('span', null, h('i', { style: { background: '#0B4F5C' } }), 'Arrivo'), h('span', null, h('i', { style: { background: '#F2A93B' } }), 'Partenza'),
      (hasNum(it.min) || hasNum(it.max)) ? h('span', null, h('i', { style: { background: '#2E7D32', opacity: '.3', height: '8px' } }), 'Riferimento') : null));
}
function historyTable(rows, it) {
  return h('table', { class: 'htable' },
    h('thead', null, h('tr', null, h('th', null, 'Data'), h('th', null, 'Arrivo'), h('th', null, 'Partenza'))),
    h('tbody', null, rows.slice().reverse().map(x => h('tr', { onclick: () => go('/r/' + encodeURIComponent(x.r.id)) },
      h('td', null, fmtDate(repDate(x.r))),
      h('td', { class: isAlert(it, x.v.a) ? 'bad' : '' }, displayVal(it, x.v.a) || '—'),
      h('td', { class: isAlert(it, x.v.p) ? 'bad' : '' }, displayVal(it, x.v.p) || '—')))));
}

/* ================================================================ BACKUP */
function blobToB64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || '');
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(blob);
  });
}
function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: type || 'image/jpeg' });
}
async function exportBackup() {
  flushSaves();
  const b = busy('Preparo il backup…');
  try {
    const settings = await DB.allSettings();
    delete settings.logo;
    const photos = await DB.all('photos');
    const name = 'Backup Report Impianti ' + fmtDate(todayISO(), '-') + '.json';
    const chunks = ['{"app":"ReportImpianti","kind":"backup","version":2,"exportedAt":' + Date.now() +
      ',"settings":' + JSON.stringify(settings) +
      ',"logo":' + (S.logo ? JSON.stringify({ w: S.logo.w, h: S.logo.h, data: await blobToB64(S.logo.blob) }) : 'null') +
      ',"templates":' + JSON.stringify(S.templates) +
      ',"reports":' + JSON.stringify(S.reports) + ',"photos":['];
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i];
      b.set('Backup foto ' + (i + 1) + ' di ' + photos.length);
      chunks.push((i ? ',' : '') + JSON.stringify({ id: p.id, reportId: p.reportId, w: p.w, h: p.h, createdAt: p.createdAt, data: await blobToB64(p.blob) }));
    }
    chunks.push(']}');
    b.done();
    await Native.saveFile(new Blob(chunks, { type: 'application/json' }), name, 'application/json');
    S.settings.lastBackup = Date.now();
    await DB.setSetting('lastBackup', S.settings.lastBackup);
    toast('Backup salvato: ' + S.reports.length + ' report, ' + photos.length + ' foto');
    if (parts()[0] === 's') render();
  } catch (e) {
    b.done();
    toast(e.message === 'Salvataggio annullato' ? e.message : 'Errore backup: ' + e.message);
  }
}
async function importFile() {
  let blob;
  try { blob = await Native.pickFile(); } catch (e) { toast(e.message); return; }
  if (!blob) return;
  let data;
  const b = busy('Leggo il file…');
  try { data = JSON.parse(await blob.text()); } catch (e) { b.done(); toast('File non valido'); return; }
  b.done();
  if (!data || data.app !== 'ReportImpianti') { toast('Il file non è un backup o un modello di Report Impianti'); return; }
  if (data.kind === 'template') {
    const t = data.template;
    if (S.templates.some(x => x.id === t.id)) {
      const how = await ask('Modello già presente', '«' + t.name + '» esiste già. Vuoi sostituirlo o aggiungerlo come copia?',
        [{ label: 'Annulla', value: false }, { label: 'Copia', value: 'copy' }, { label: 'Sostituisci', value: 'rep', cls: 'pri' }]);
      if (!how) return;
      if (how === 'copy') { t.id = 'tpl_' + uid(); t.name += ' (importato)'; }
    }
    await DB.put('templates', t);
    S.templates = await DB.all('templates');
    toast('Modello importato');
    go('/t/' + encodeURIComponent(t.id));
    return;
  }
  const ok = await ask('Importare il backup?', (data.reports || []).length + ' report, ' + (data.photos || []).length + ' foto e ' + (data.templates || []).length +
    ' modelli. I dati già presenti con lo stesso identificativo verranno aggiornati, gli altri restano.', [{ label: 'Annulla', value: false }, { label: 'Importa', value: true, cls: 'pri' }]);
  if (!ok) return;
  const b2 = busy('Importo…');
  try {
    for (const t of data.templates || []) await DB.put('templates', t);
    for (const r of data.reports || []) await DB.put('reports', r);
    const ph = data.photos || [];
    for (let i = 0; i < ph.length; i++) {
      b2.set('Importo foto ' + (i + 1) + ' di ' + ph.length);
      const p = ph[i];
      await DB.put('photos', { id: p.id, reportId: p.reportId, w: p.w, h: p.h, createdAt: p.createdAt, blob: b64ToBlob(p.data) });
    }
    if (data.settings) for (const k in data.settings) await DB.setSetting(k, data.settings[k]);
    if (data.logo) await DB.setSetting('logo', { w: data.logo.w, h: data.logo.h, blob: b64ToBlob(data.logo.data) });
    await loadAll();
    b2.done();
    toast('Backup importato');
    go('/');
    render();
  } catch (e) {
    b2.done();
    toast('Errore importazione: ' + e.message);
  }
}

/* ================================================================ AVVIO */
async function loadAll() {
  S.templates = await DB.all('templates');
  if (!S.templates.length) {
    const t = defaultTemplate();
    await DB.put('templates', t);
    S.templates = [t];
  }
  S.templates.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  S.reports = await DB.all('reports');
  const st = await DB.allSettings();
  S.logo = st.logo || null;
  delete st.logo;
  S.plants = Array.isArray(st.plants) ? st.plants : [];
  delete st.plants;
  for (const r of S.reports) {
    const n = repPlant(r);
    if (n && !S.plants.some(p => norm(p.name) === norm(n))) S.plants.push({ id: 'pl' + uid(), name: n, folder: n, createdAt: Date.now() });
  }
  DB.setSetting('plants', S.plants);
  S.settings = Object.assign({}, DEFAULT_SETTINGS, st);
}
(async function init() {
  try {
    await loadAll();
  } catch (e) {
    app.appendChild(h('div', { class: 'empty' }, h('b', null, 'Errore di avvio'), String(e && e.message)));
    return;
  }
  try { history.replaceState({ p: '/' }, ''); } catch (e) { /* ignora */ }
  render();
})();
