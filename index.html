<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F5C">
<title>Report Impianti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  color-scheme: light;
  --pri: #0B4F5C;
  --pri-2: #0E6474;
  --pri-soft: #E3EFF1;
  --acc: #F2A93B;
  --bg: #F2F4F5;
  --card: #FFFFFF;
  --ink: #17242A;
  --ink-2: #4D5D64;
  --ink-3: #8A989E;
  --line: #DDE3E6;
  --red: #C62828;
  --red-soft: #FDECEA;
  --green: #2E7D32;
  --green-soft: #E8F5E9;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 40, 48, .06), 0 2px 10px rgba(16, 40, 48, .06);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.4;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 18px; height: 18px; }

/* ---------- app bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--pri); color: #fff;
  display: flex; align-items: center; gap: 4px;
  min-height: 56px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
}
.bar.has-back { padding-left: max(4px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--pri); }
.bar .ttl { flex: 1; min-width: 0; }
.bar .ttl b { display: block; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl small { display: block; font-size: 12.5px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: inherit;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.ib:active { background: rgba(255,255,255,.16); }
.bar .pill {
  border: 0; background: var(--acc); color: #2B1B00; font-weight: 600;
  height: 36px; padding: 0 14px; border-radius: 18px; display: inline-flex; align-items: center; gap: 6px; margin-right: 4px;
}
.saved { font-size: 11.5px; opacity: .75; margin-right: 4px; transition: opacity .3s; }

/* ---------- layout ---------- */
.page { padding-top: 12px; padding-bottom: calc(96px + var(--safe-b)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 820px; margin: 0 auto; }
.page.with-nav { padding-bottom: calc(150px + var(--safe-b)); }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.card-h {
  display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px;
  font-weight: 600; font-size: 15.5px; border-bottom: 1px solid var(--line);
}
.card-h .grow { flex: 1; min-width: 0; }
.card-h .count { font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.card-h.click { cursor: pointer; user-select: none; }
.card-h .chev { transition: transform .2s; color: var(--ink-3); }
.card.collapsed .card-h { border-bottom: 0; }
.card.collapsed .card-h .chev { transform: rotate(-90deg); }
.card.collapsed .card-b { display: none; }
.card-b { padding: 4px 14px 14px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.sp { height: 10px; }
h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 18px 4px 8px; font-weight: 600; }

/* ---------- forms ---------- */
.fld { display: block; margin-top: 12px; }
.fld > span { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }
.in, select.in, textarea.in {
  width: 100%; min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  padding: 10px 12px; outline: none; transition: border-color .15s, background .15s;
}
textarea.in { resize: none; min-height: 80px; line-height: 1.45; }
textarea.in.tv { min-height: 46px; line-height: 1.35; padding-top: 11px; padding-bottom: 9px; }
.in:focus { border-color: var(--pri-2); background: #FBFEFE; }
.in.bad { border-color: var(--red); background: var(--red-soft); color: var(--red); font-weight: 600; }
.in.ok { border-color: #9CCCA0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid2 > .full { grid-column: 1 / -1; }
.chk { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14.5px; }
.chk input { width: 22px; height: 22px; accent-color: var(--pri); flex: none; }

.btn {
  border: 0; border-radius: 12px; min-height: 46px; padding: 0 16px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--pri-soft); color: var(--pri);
}
.btn.pri { background: var(--pri); color: #fff; }
.btn.acc { background: var(--acc); color: #2B1B00; }
.btn.red { background: var(--red-soft); color: var(--red); }
.btn.ghost { background: transparent; color: var(--pri); }
.btn.block { width: 100%; }
.btn:active { filter: brightness(.94); }
.btn[disabled] { opacity: .5; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btns > .btn { flex: 1 1 auto; }

/* ---------- checklist item ---------- */
.item { padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.alert { background: linear-gradient(90deg, rgba(198,40,40,.06), transparent 70%); margin: 0 -14px; padding: 12px 14px; }
.item-top { display: flex; gap: 8px; align-items: flex-start; }
.num {
  min-width: 26px; height: 22px; padding: 0 5px; border-radius: 6px; background: var(--pri-soft); color: var(--pri);
  font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; flex: none;
}
.item-lbl { flex: 1; min-width: 0; font-weight: 500; }
.item-ref { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.prev { font-size: 12px; color: var(--pri-2); margin-top: 3px; }
.prev b { font-weight: 600; }
.item .ib { width: 38px; height: 38px; color: var(--ink-3); margin: -6px -6px 0 0; }
.item .ib.on { color: var(--pri); }
.vals { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 6px; align-items: end; margin-top: 8px; }
.vals.single { grid-template-columns: 1fr; }
.vals label > span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 3px; font-weight: 600; }
.cp {
  height: 46px; width: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
}
.cp:active { background: var(--pri-soft); color: var(--pri); }
.warn { font-size: 12px; color: var(--red); margin-top: 5px; font-weight: 500; display: flex; gap: 4px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1.5px solid var(--line); background: #fff; border-radius: 18px; min-height: 36px; padding: 0 13px;
  font-size: 14px; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2);
}
.chip.on { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
.chip.on.bad { background: var(--red); border-color: var(--red); }
.chip.sug { min-height: 30px; font-size: 12.5px; padding: 0 10px; border-style: dashed; }
.chiprow { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.chiprow > span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; }
.chiprow .cpx { grid-column: 2; justify-self: start; }
.note-in { margin-top: 8px; min-height: 60px; font-size: 14px; }

/* ---------- lists ---------- */
.li {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); background: #fff; cursor: pointer;
}
.li:first-child { border-top: 0; }
.li:active { background: #F6F9F9; }
.li .ttl2 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .sub { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar {
  width: 42px; height: 42px; border-radius: 12px; background: var(--pri-soft); color: var(--pri);
  display: flex; align-items: center; justify-content: center; flex: none; font-weight: 700; font-size: 13px; text-align: center; line-height: 1.05;
}
.avatar small { display: block; font-size: 10px; font-weight: 600; opacity: .8; }
.badges { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
.bdg { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 8px; background: #EEF2F3; color: var(--ink-2); display: inline-flex; align-items: center; gap: 3px; }
.bdg.red { background: var(--red-soft); color: var(--red); }
.bdg.green { background: var(--green-soft); color: var(--green); }
.bdg svg.i { width: 13px; height: 13px; }
.search { position: relative; margin-bottom: 12px; }
.search .in { padding-left: 42px; border-radius: 24px; background: #fff; border-color: transparent; box-shadow: var(--shadow); }
.search svg { position: absolute; left: 14px; top: 12px; color: var(--ink-3); }
.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); }
.empty svg.i { width: 56px; height: 56px; stroke-width: 1.4; color: #B5C4C9; }
.empty b { display: block; color: var(--ink-2); font-size: 17px; margin: 12px 0 6px; }

/* ---------- FAB / bottom nav ---------- */
.fab {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + var(--safe-b)); z-index: 30;
  height: 56px; border-radius: 18px; border: 0; background: var(--acc); color: #2B1B00; font-weight: 700; font-size: 15.5px;
  padding: 0 20px 0 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.22);
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: #fff; border-top: 1px solid var(--line);
  display: flex; padding-bottom: var(--safe-b);
}
.nav button {
  flex: 1; border: 0; background: none; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; color: var(--ink-3); font-weight: 500;
}
.nav button .pillbg { width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
.nav button.on { color: var(--pri); font-weight: 700; }
.nav button.on .pillbg { background: var(--pri-soft); }
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(255,255,255,.96); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + var(--safe-b)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; backdrop-filter: blur(6px);
}
.bottombar .btn { flex: 1; }

/* ---------- section tabs ---------- */
.tabs {
  position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 15; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 8px;
  scrollbar-width: none; margin: -12px -16px 6px;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; border: 0; background: #fff; border-radius: 16px; height: 32px; padding: 0 12px; font-size: 13px; color: var(--ink-2);
  box-shadow: var(--shadow); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
}
.tabs button .dot { width: 7px; height: 7px; border-radius: 50%; background: #C9D3D6; }
.tabs button .dot.full { background: var(--green); }
.tabs button .dot.alert { background: var(--red); }
.progress { height: 4px; background: #D9E2E5; border-radius: 2px; overflow: hidden; margin: 2px 2px 12px; }
.progress > i { display: block; height: 100%; background: var(--green); border-radius: 2px; transition: width .3s; }
.summary { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

/* ---------- photos ---------- */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #E6ECEE; cursor: pointer; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #fff; padding: 14px 6px 4px; background: linear-gradient(transparent, rgba(0,0,0,.65)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph .n { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; }
.photo-big { width: 100%; max-height: 52vh; object-fit: contain; background: #111; border-radius: 12px; display: block; }

/* ---------- sheet / modal ---------- */
#overlay { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: rgba(10, 25, 30, .45); opacity: 0; transition: opacity .2s; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: #fff;
  border-radius: 20px 20px 0 0; padding: 8px 16px calc(18px + var(--safe-b)); transform: translateY(100%); transition: transform .22s ease-out;
  pointer-events: auto; max-width: 820px; margin: 0 auto;
}
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #CBD5D8; margin: 4px auto 10px; }
.sheet h2 { margin: 4px 0 4px; font-size: 19px; }
.sheet .sub { color: var(--ink-3); font-size: 13.5px; margin-bottom: 4px; }
.layer.open .scrim { opacity: 1; }
.layer.open .sheet { transform: none; }
.menu-it { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; padding: 14px 6px; font-size: 15.5px; text-align: left; border-radius: 10px; }
.menu-it:active { background: #F1F5F6; }
.menu-it.red { color: var(--red); }
.menu-it svg.i { color: var(--ink-3); }
.menu-it.red svg.i { color: var(--red); }
.files { margin-top: 10px; }
.file-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.file-row .grow { font-size: 14px; word-break: break-word; }
.file-row .ib { color: var(--pri); }

#toast {
  position: fixed; left: 50%; bottom: calc(150px + var(--safe-b)); transform: translate(-50%, 20px); z-index: 200;
  background: #1F2D33; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none;
  max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.busy { position: fixed; inset: 0; z-index: 300; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-weight: 600; color: var(--pri); }
.spin { width: 42px; height: 42px; border: 4px solid var(--pri-soft); border-top-color: var(--pri); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- editor ---------- */
.ed-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.ed-row:first-child { border-top: 0; }
.ed-row .grow { cursor: pointer; padding: 4px 0; }
.ed-row .t { font-size: 14.5px; font-weight: 500; }
.ed-row .s { font-size: 12px; color: var(--ink-3); }
.ed-row .ib { width: 36px; height: 36px; color: var(--ink-3); }
.ed-row .ib[disabled] { opacity: .25; }
.tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; background: #EEF2F3; color: var(--ink-2); }
.info-box { background: var(--pri-soft); color: var(--pri); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; display: flex; gap: 10px; }
.info-box svg { flex: none; margin-top: 1px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line); }
.sw.on { box-shadow: 0 0 0 3px var(--ink); }
.logo-prev { max-width: 180px; max-height: 70px; display: block; margin-top: 8px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px; background: #fff; }

/* ---------- history chart ---------- */
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.htable { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
.htable th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.htable td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.htable td.bad { color: var(--red); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

@media (min-width: 640px) {
  .photos { grid-template-columns: repeat(4, 1fr); }
}

/* ---------- web: impianti, foto per voce, istruzioni ---------- */
.plant-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.iph { margin-top: 8px; }
.iph-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip.phb { min-height: 34px; font-size: 13px; border-color: #C7D6DA; color: var(--pri); background: #F5FAFB; }
.chip.phb .phn { background: var(--pri); color: #fff; border-radius: 9px; font-size: 11px; font-weight: 700; padding: 0 6px; line-height: 17px; }
.iph-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.ph.sm { border-radius: 8px; }
.ph.off img { opacity: .45; filter: grayscale(.6); }
.ph .ex { position: absolute; left: 4px; right: 4px; bottom: 4px; font-size: 10px; font-weight: 700; color: #fff; background: rgba(198,40,40,.85); border-radius: 5px; text-align: center; padding: 1px 2px; }
.ph.off .cap { background: linear-gradient(transparent, rgba(198,40,40,.85)); }
ol.steps { margin: 14px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14.5px; }
ol.steps b { color: var(--pri); }
a.btn { text-decoration: none; }
.sheet { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast"></div>

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  add(el, kids);
  return el;
}
function add(el, kids) {
  for (const k of kids) {
    if (k == null || k === false) continue;
    if (Array.isArray(k)) add(el, k);
    else if (k instanceof Node) el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)));
  }
}

/* ---------- bottom sheets ---------- */
const layers = [];
function sheet(build, opts) {
  opts = opts || {};
  const ov = document.getElementById('overlay');
  const layer = h('div', { class: 'layer' });
  const scrim = h('div', { class: 'scrim' });
  const box = h('div', { class: 'sheet' }, h('div', { class: 'grab' }));
  layer.append(scrim, box);
  ov.appendChild(layer);
  let closed = false;
  const api = {
    el: box,
    close(val) {
      if (closed) return;
      closed = true;
      layer.classList.remove('open');
      const i = layers.indexOf(api);
      if (i >= 0) layers.splice(i, 1);
      setTimeout(() => layer.remove(), 230);
      if (opts.onClose) opts.onClose(val);
    },
  };
  scrim.addEventListener('click', () => api.close());
  add(box, [build(api)]);
  layers.push(api);
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('open')));
  return api;
}
function closeTopLayer() {
  if (!layers.length) return false;
  layers[layers.length - 1].close();
  return true;
}

/* Archivio locale (IndexedDB): modelli, report, foto, impostazioni */
const DB = (() => {
  let dbp;
  function open() {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        const r = indexedDB.open('reportimpianti', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const s of ['templates', 'reports', 'photos']) {
            if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
          }
          if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'k' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      const r = fn(s);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Transazione annullata'));
    });
  }
  const api = {
    all: s => tx(s, 'readonly', st => st.getAll()),
    get: (s, id) => tx(s, 'readonly', st => st.get(id)),
    put: (s, obj) => tx(s, 'readwrite', st => st.put(obj)),
    del: (s, id) => tx(s, 'readwrite', st => st.delete(id)),
    async getSetting(k, def) {
      const r = await api.get('settings', k);
      return r ? r.v : def;
    },
    setSetting: (k, v) => tx('settings', 'readwrite', st => st.put({ k, v })),
    async allSettings() {
      const rows = await api.all('settings');
      const o = {};
      for (const r of rows) o[r.k] = r.v;
      return o;
    },
  };
  return api;
})();

/* Ponte verso Android (AndroidBridge) con alternative per il browser */
const Native = (() => {
  const B = window.AndroidBridge;
  const isApp = !!B;
  const pending = {};
  window.__nativeCb = (id, payload) => {
    const p = pending[id];
    if (!p) return;
    delete pending[id];
    let v;
    try { v = JSON.parse(payload); } catch (e) { v = payload; }
    if (v && v.error) p.rej(new Error(v.error)); else p.res(v);
  };
  function call(fn, ...args) {
    return new Promise((res, rej) => {
      const id = 'cb' + uid();
      pending[id] = { res, rej };
      try { B[fn](id, ...args); } catch (e) { delete pending[id]; rej(e); }
    });
  }
  function b64(bytes) {
    let s = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  }
  async function toBytes(data) {
    if (data instanceof Uint8Array) return data;
    if (data instanceof Blob) return new Uint8Array(await data.arrayBuffer());
    if (typeof data === 'string') return new TextEncoder().encode(data);
    return new Uint8Array(data);
  }
  async function tmpFrom(data) {
    const id = B.fileBegin();
    if (!id) throw new Error('Impossibile creare il file temporaneo');
    try {
      const bytes = await toBytes(data);
      const CH = 3 * 256 * 1024;
      for (let i = 0; i < bytes.length; i += CH) {
        if (!B.fileAppend(id, b64(bytes.subarray(i, i + CH)))) throw new Error('Errore di scrittura');
      }
    } finally {
      B.fileEnd(id);
    }
    return id;
  }

  /* ---- browser ---- */
  let dlP = null;
  function downloads() {
    if (!dlP) {
      dlP = (async () => {
        try { if (window.claude && typeof window.claude.use === 'function') return await window.claude.use('downloads'); } catch (e) { /* assente */ }
        return null;
      })();
    }
    return dlP;
  }
  if (!isApp) downloads();
  function pickFilesBrowser(accept, multiple, capture) {
    return new Promise(res => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = accept;
      if (multiple) inp.multiple = true;
      if (capture) inp.setAttribute('capture', 'environment');
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.onchange = () => { res(Array.from(inp.files || [])); inp.remove(); };
      inp.click();
    });
  }
  async function shrinkBlob(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Immagine non leggibile')); i.src = url; });
      const max = 1600;
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc);
      c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      return { blob, w: c.width, h: c.height };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  return {
    isApp,
    version: () => (isApp ? B.version() : 'web 2.0'),

    /** source: 'camera' | 'gallery'. Ritorna [{blob,w,h}] */
    async pickImages(source, multiple) {
      if (isApp) {
        const list = await call('pickImage', source, !!multiple);
        const out = [];
        for (const it of list || []) {
          const r = await fetch(it.url);
          out.push({ blob: await r.blob(), w: it.w, h: it.h });
          B.deleteTemp(it.url);
        }
        return out;
      }
      const files = await pickFilesBrowser('image/*', multiple, source === 'camera');
      const out = [];
      for (const f of files) out.push(await shrinkBlob(f));
      return out;
    },

    async pickFile() {
      if (isApp) {
        const r = await call('pickFile');
        if (!r) return null;
        const resp = await fetch(r.url);
        const blob = await resp.blob();
        B.deleteTemp(r.url);
        return blob;
      }
      const files = await pickFilesBrowser('.json,application/json', false);
      return files[0] || null;
    },

    /** App: salva in Download/Report Impianti → {uri,name}. Browser: download con conferma. */
    async saveFile(data, name, mime) {
      if (isApp) {
        const id = await tmpFrom(data);
        const r = await call('saveFile', id, name, mime);
        B.deleteTemp(id);
        return Object.assign({ saved: true }, r);
      }
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });

        try {
          await d.save({ filename: name, data: blob });
          return { name, saved: true };
        } catch (e) {
          if (e && e.code === 'declined') throw new Error('Salvataggio annullato');
          if (e && e.code === 'rate_limited') throw new Error('Conferma il salvataggio precedente, poi riprova');

        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { name, saved: true };
    },

    share(uris, mime, subject, email) {
      if (!isApp) { toast('Condivisione disponibile nell\'app Android'); return; }
      if (B.shareTo) B.shareTo(JSON.stringify(uris), mime, subject || '', email || '');
      else B.share(JSON.stringify(uris), mime, subject || '');
    },
    open(uri, mime) {
      if (isApp) B.open(uri, mime);
    },
  };
})();

/* ---------- ZIP (senza compressione: JPEG e PDF sono già compressi) ---------- */
const Zip = (() => {
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    T[n] = c >>> 0;
  }
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = T[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function bytes(d) {
    if (d instanceof Uint8Array) return d;
    if (d instanceof Blob) return new Uint8Array(await d.arrayBuffer());
    if (typeof d === 'string') return new TextEncoder().encode(d);
    return new Uint8Array(d);
  }
  /** files: [{path, data}] → Blob */
  async function build(files) {
    const enc = new TextEncoder();
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const parts = [];
    const central = [];
    let off = 0;
    for (const f of files) {
      const name = enc.encode(f.path);
      const data = await bytes(f.data);
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((a, c) => a + c.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, off, true); end.setUint16(20, 0, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }
  return { build, crc32 };
})();

'use strict';
/* Generatore PDF minimale: testo Helvetica (WinAnsi), rettangoli, linee, immagini JPEG. */

const PDF_CP1252 = {
  0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88,
  0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93,
  0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B,
  0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F,
};
const PDF_SUBST = {
  '≤': '<=', '≥': '>=', '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '→': '->', '←': '<-', '⇒': '=>',
  '☑': '', '☐': '', '✓': 'v', '✔': 'v', '➖': '-', '−': '-', ' ': ' ', ' ': ' ', '⚠': '!', '…': '...',
};

function pdfEncode(str) {
  // ritorna stringa "binaria" (char code 0..255) in cp1252
  let out = '';
  const s = String(str == null ? '' : str);
  for (const chRaw of s) {
    let ch = PDF_SUBST[chRaw] !== undefined ? PDF_SUBST[chRaw] : chRaw;
    for (const c of ch) {
      const cp = c.codePointAt(0);
      if (cp === 10 || cp === 13 || cp === 9) { out += ' '; continue; }
      if (cp < 32) continue;
      if (cp < 128 || (cp >= 0xA0 && cp <= 0xFF)) { out += String.fromCharCode(cp); continue; }
      if (PDF_CP1252[cp]) { out += String.fromCharCode(PDF_CP1252[cp]); continue; }
      const base = c.normalize('NFD').replace(/[̀-ͯ]/g, '');
      const bcp = base.codePointAt(0);
      if (base && bcp < 256 && bcp >= 32) out += base[0];
      else out += '?';
    }
  }
  return out;
}

class PdfDoc {
  constructor() {
    this.W = 595.28;
    this.H = 841.89;
    this.pages = [];
    this.images = [];
    this.cur = null;
  }
  addPage() {
    this.cur = { ops: [], imgs: new Set(), draw: [] };
    this.pages.push(this.cur);
    return this.cur;
  }
  static col(hex) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '#000000');
    if (!m) return '0 0 0';
    return [m[1], m[2], m[3]].map(x => (parseInt(x, 16) / 255).toFixed(3)).join(' ');
  }
  static n(v) { return (Math.round(v * 100) / 100).toString(); }

  textWidth(str, f, size) {
    const enc = pdfEncode(str);
    const tbl = FONT_W[f || 'R'];
    let w = 0;
    for (let i = 0; i < enc.length; i++) {
      const c = enc.charCodeAt(i);
      w += c >= 32 ? (tbl[c - 32] || 556) : 0;
    }
    return w * size / 1000;
  }
  wrap(str, f, size, maxW) {
    const lines = [];
    const paras = String(str == null ? '' : str).replace(/\r/g, '').split('\n');
    for (const p of paras) {
      const words = p.split(/ +/);
      let line = '';
      for (let w of words) {
        // spezza parole troppo lunghe
        while (this.textWidth(w, f, size) > maxW && w.length > 1) {
          let k = w.length - 1;
          while (k > 1 && this.textWidth(w.slice(0, k), f, size) > maxW) k--;
          if (line) { lines.push(line); line = ''; }
          lines.push(w.slice(0, k));
          w = w.slice(k);
        }
        const test = line ? line + ' ' + w : w;
        if (this.textWidth(test, f, size) <= maxW) line = test;
        else { if (line) lines.push(line); line = w; }
      }
      lines.push(line);
    }
    return lines;
  }
  rect(x, y, w, h, o) {
    o = o || {};
    const N = PdfDoc.n;
    let s = 'q ';
    if (o.fill) s += PdfDoc.col(o.fill) + ' rg ';
    if (o.stroke) s += PdfDoc.col(o.stroke) + ' RG ' + N(o.lw || 0.5) + ' w ';
    s += N(x) + ' ' + N(this.H - y - h) + ' ' + N(w) + ' ' + N(h) + ' re ';
    s += o.fill && o.stroke ? 'B' : o.fill ? 'f' : 'S';
    s += ' Q';
    this.cur.ops.push(s);
    this.cur.draw.push({ t: 'rect', x, y, w, h, fill: o.fill, stroke: o.stroke, lw: o.lw || 0.5 });
  }
  line(x1, y1, x2, y2, color, lw) {
    const N = PdfDoc.n;
    this.cur.draw.push({ t: 'line', x1, y1, x2, y2, color: color || '#000000', lw: lw || 0.5 });
    this.cur.ops.push('q ' + PdfDoc.col(color || '#000000') + ' RG ' + N(lw || 0.5) + ' w ' +
      N(x1) + ' ' + N(this.H - y1) + ' m ' + N(x2) + ' ' + N(this.H - y2) + ' l S Q');
  }
  /** y = linea di base misurata dall'alto */
  text(str, x, y, o) {
    o = o || {};
    const f = o.f || 'R';
    const size = o.size || 9;
    const enc = pdfEncode(str);
    if (!enc) return;
    let xx = x;
    if (o.align === 'right') xx = x - this.textWidth(str, f, size);
    else if (o.align === 'center') xx = x - this.textWidth(str, f, size) / 2;
    const esc = enc.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
    const fname = { R: 'F1', B: 'F2', I: 'F3' }[f];
    this.cur.draw.push({ t: 'text', str: String(str), x: xx, y, f, size, color: o.color || '#000000', pw: this.textWidth(str, f, size) });
    const N = PdfDoc.n;
    this.cur.ops.push('BT ' + PdfDoc.col(o.color || '#000000') + ' rg /' + fname + ' ' + N(size) + ' Tf 1 0 0 1 ' +
      N(xx) + ' ' + N(this.H - y) + ' Tm (' + esc + ') Tj ET');
  }
  addImage(bytes, w, h) {
    this.images.push({ bytes, w, h });
    return this.images.length - 1;
  }
  image(idx, x, y, w, h) {
    const N = PdfDoc.n;
    this.cur.imgs.add(idx);
    this.cur.draw.push({ t: 'img', idx, x, y, w, h });
    this.cur.ops.push('q ' + N(w) + ' 0 0 ' + N(h) + ' ' + N(x) + ' ' + N(this.H - y - h) + ' cm /Im' + idx + ' Do Q');
  }

  async output(meta) {
    meta = meta || {};
    const enc = s => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b; };
    const canZip = typeof CompressionStream !== 'undefined';
    async function deflate(bytes) {
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
      return new Uint8Array(await new Response(st).arrayBuffer());
    }
    const objs = []; // ognuno: array di Uint8Array
    const reserve = () => { objs.push(null); return objs.length; };
    const set = (n, parts) => { objs[n - 1] = parts; };

    const catalog = reserve();
    const pagesN = reserve();
    const fonts = ['Helvetica', 'Helvetica-Bold', 'Helvetica-Oblique'].map(bf => {
      const n = reserve();
      set(n, [enc('<< /Type /Font /Subtype /Type1 /BaseFont /' + bf + ' /Encoding /WinAnsiEncoding >>')]);
      return n;
    });
    const imgN = this.images.map(im => {
      const n = reserve();
      set(n, [enc('<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.bytes.length + ' >>\nstream\n'),
      im.bytes, enc('\nendstream')]);
      return n;
    });
    const pageNs = [];
    for (const p of this.pages) {
      const pn = reserve();
      const cn = reserve();
      pageNs.push(pn);
      let content = enc(p.ops.join('\n'));
      let filter = '';
      if (canZip) {
        try { content = await deflate(content); filter = ' /Filter /FlateDecode'; } catch (e) { /* senza compressione */ }
      }
      set(cn, [enc('<< /Length ' + content.length + filter + ' >>\nstream\n'), content, enc('\nendstream')]);
      let xo = '';
      if (p.imgs.size) xo = ' /XObject << ' + Array.from(p.imgs).map(i => '/Im' + i + ' ' + imgN[i] + ' 0 R').join(' ') + ' >>';
      set(pn, [enc('<< /Type /Page /Parent ' + pagesN + ' 0 R /MediaBox [0 0 ' + this.W + ' ' + this.H + '] /Resources << /Font << /F1 ' +
        fonts[0] + ' 0 R /F2 ' + fonts[1] + ' 0 R /F3 ' + fonts[2] + ' 0 R >>' + xo + ' >> /Contents ' + cn + ' 0 R >>')]);
    }
    set(pagesN, [enc('<< /Type /Pages /Kids [' + pageNs.map(n => n + ' 0 R').join(' ') + '] /Count ' + pageNs.length + ' >>')]);
    set(catalog, [enc('<< /Type /Catalog /Pages ' + pagesN + ' 0 R >>')]);
    const pstr = s => '(' + pdfEncode(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)') + ')';
    const info = reserve();
    const d = new Date();
    const pd = 'D:' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
      String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + String(d.getSeconds()).padStart(2, '0');
    set(info, [enc('<< /Title ' + pstr(meta.title || 'Report') + ' /Author ' + pstr(meta.author || '') +
      ' /Producer (Report Impianti) /CreationDate (' + pd + ') >>')]);

    const chunks = [enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
    let off = chunks[0].length;
    const xref = [];
    objs.forEach((parts, i) => {
      xref.push(off);
      const head = enc((i + 1) + ' 0 obj\n');
      chunks.push(head); off += head.length;
      for (const p of parts) { chunks.push(p); off += p.length; }
      const tail = enc('\nendobj\n');
      chunks.push(tail); off += tail.length;
    });
    let x = 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    for (const o of xref) x += String(o).padStart(10, '0') + ' 00000 n \n';
    x += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalog + ' 0 R /Info ' + info + ' 0 R >>\nstartxref\n' + off + '\n%%EOF\n';
    chunks.push(enc(x));
    const total = chunks.reduce((a, c) => a + c.length, 0);
    const out = new Uint8Array(total);
    let p = 0;
    for (const c of chunks) { out.set(c, p); p += c.length; }
    return out;
  }
}

/* ---------- Rendering delle pagine in JPEG (canvas) ---------- */
async function pdfPagesToJpeg(doc, dpi) {
  const sc = (dpi || 150) / 72;
  try { await Promise.all(['400 10px Arimo', '700 10px Arimo', 'italic 400 10px Arimo'].map(f => document.fonts.load(f))); } catch (e) { /* font di riserva */ }
  const bitmaps = [];
  for (const im of doc.images) {
    try { bitmaps.push(await createImageBitmap(new Blob([im.bytes], { type: 'image/jpeg' }))); } catch (e) { bitmaps.push(null); }
  }
  const out = [];
  for (const p of doc.pages) {
    const c = document.createElement('canvas');
    c.width = Math.round(doc.W * sc);
    c.height = Math.round(doc.H * sc);
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, c.width, c.height);
    g.scale(sc, sc);
    for (const d of p.draw) {
      if (d.t === 'rect') {
        if (d.fill) { g.fillStyle = d.fill; g.fillRect(d.x, d.y, d.w, d.h); }
        if (d.stroke) { g.strokeStyle = d.stroke; g.lineWidth = d.lw; g.strokeRect(d.x, d.y, d.w, d.h); }
      } else if (d.t === 'line') {
        g.strokeStyle = d.color; g.lineWidth = d.lw;
        g.beginPath(); g.moveTo(d.x1, d.y1); g.lineTo(d.x2, d.y2); g.stroke();
      } else if (d.t === 'img') {
        const b = bitmaps[d.idx];
        if (b) g.drawImage(b, d.x, d.y, d.w, d.h);
      } else if (d.t === 'text') {
        g.font = (d.f === 'I' ? 'italic ' : '') + (d.f === 'B' ? '700 ' : '400 ') + d.size + 'px Arimo, "Liberation Sans", Arial, Helvetica, sans-serif';
        g.fillStyle = d.color;
        g.textBaseline = 'alphabetic';
        const m = g.measureText(d.str).width;
        if (m > d.pw * 1.002 && m > 0) {
          g.save(); g.translate(d.x, d.y); g.scale(d.pw / m, 1); g.fillText(d.str, 0, 0); g.restore();
        } else g.fillText(d.str, d.x, d.y);
      }
    }
    out.push(await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)));
  }
  return out;
}

'use strict';
/* Logica dei report (valutazione valori) e impaginazione del PDF */

function hdrField(tpl, role) { return (tpl.headerFields || []).find(f => f.role === role); }
function hdrVal(rep, role) {
  const f = hdrField(rep.tpl, role);
  return f ? String(rep.header[f.id] || '') : '';
}
function repPlant(rep) { return hdrVal(rep, 'plant').trim(); }
function repDate(rep) { return hdrVal(rep, 'date') || (rep.createdAt ? new Date(rep.createdAt).toISOString().slice(0, 10) : ''); }
function itemVal(rep, it) { return rep.values[it.id] || { a: '', p: '', n: '' }; }
function hasNum(v) { return v !== null && v !== undefined && v !== '' && !isNaN(+v); }
function isAlert(it, v) {
  if (v == null || String(v).trim() === '') return false;
  if (it.type === 'number') {
    const n = parseNum(v);
    if (isNaN(n)) return false;
    if (hasNum(it.min) && n < +it.min) return true;
    if (hasNum(it.max) && n > +it.max) return true;
    return false;
  }
  return (it.alert || []).some(a => norm(a) === norm(v));
}
function rangeText(it) {
  const u = it.unit ? ' ' + it.unit : '';
  if (hasNum(it.min) && hasNum(it.max)) return fmtNum(+it.min) + ' – ' + fmtNum(+it.max) + u;
  if (hasNum(it.min)) return '≥ ' + fmtNum(+it.min) + u;
  if (hasNum(it.max)) return '≤ ' + fmtNum(+it.max) + u;
  return '';
}
function displayVal(it, v) {
  if (v == null) return '';
  const s = String(v).trim();
  if (!s) return '';
  if (it.type === 'number') {
    const n = parseNum(s);
    if (!isNaN(n)) return fmtNum(n) + (it.unit ? ' ' + it.unit : '');
  }
  return s;
}
function repStats(rep) {
  let total = 0, done = 0, alerts = 0;
  const secs = {};
  for (const s of rep.tpl.sections) {
    let st = 0, sd = 0, sa = 0;
    for (const it of s.items) {
      const v = itemVal(rep, it);
      total++; st++;
      const full = String(v.a || '').trim() && (it.single || String(v.p || '').trim());
      if (full) { done++; sd++; }
      if (isAlert(it, v.a) || (!it.single && isAlert(it, v.p))) { alerts++; sa++; }
    }
    secs[s.id] = { total: st, done: sd, alerts: sa };
  }
  return { total, done, alerts, secs };
}
function fileBase(rep, st) {
  const pat = (st && st.filePattern) || DEFAULT_SETTINGS.filePattern;
  const s = pat
    .replace(/\{impianto\}/gi, repPlant(rep) || 'Impianto')
    .replace(/\{data\}/gi, fmtDate(repDate(rep), '-'))
    .replace(/\{modello\}/gi, rep.tpl.name || rep.tpl.title || 'Report')
    .replace(/\{tecnico\}/gi, hdrVal(rep, 'tech'));
  return safeFile(s);
}
function fmtHeader(f, v) {
  if (!v) return '';
  if (f.type === 'date') return fmtDate(v);
  if (f.type === 'number') { const n = parseNum(v); return isNaN(n) ? v : fmtNum(n); }
  return v;
}

/**
 * Crea il PDF del report.
 * opts: { photos:[{blob,w,h,caption}], logo:{blob,w,h}|null, includePhotos, summary, photosPerRow }
 */
async function buildReportPdf(rep, st, opts) {
  const tpl = rep.tpl;
  const doc = new PdfDoc();
  const W = doc.W, H = doc.H, M = 30, CW = W - 2 * M;
  const ACC = st.accent || '#0B4F5C';
  const INK = '#17242A', INK2 = '#4D5D64', INK3 = '#7D8B91', LINE = '#CFD8DB', RED = '#C62828', REDBG = '#FDECEA', ZEBRA = '#F7F9FA';
  const BOTTOM = H - 40;
  let y = M;
  let page = 0;
  const newPage = () => { doc.addPage(); page++; y = M; };
  const room = need => y + need <= BOTTOM;
  newPage();

  /* ---------- intestazione ---------- */
  let logoBottom = M;
  let rightW = 0;
  if (opts.logo && opts.logo.blob) {
    const bytes = new Uint8Array(await opts.logo.blob.arrayBuffer());
    const idx = doc.addImage(bytes, opts.logo.w, opts.logo.h);
    const sc = Math.min(130 / opts.logo.w, 48 / opts.logo.h);
    const lw = opts.logo.w * sc, lh = opts.logo.h * sc;
    doc.image(idx, W - M - lw, M - 2, lw, lh);
    logoBottom = M - 2 + lh;
    rightW = lw + 14;
  }
  const tLines = doc.wrap(tpl.title || 'Report', 'B', 16, CW - rightW);
  for (const l of tLines) { doc.text(l, M, y + 14, { f: 'B', size: 16, color: INK }); y += 19; }
  if (st.azienda) {
    doc.text(st.azienda, M, y + 9, { f: 'B', size: 9, color: ACC });
    y += 13;
  }
  if (tpl.subtitle) {
    y += 2;
    for (const l of doc.wrap(tpl.subtitle, 'I', 7.6, CW - rightW)) { doc.text(l, M, y + 7.5, { f: 'I', size: 7.6, color: INK3 }); y += 9.4; }
  }
  y = Math.max(y, logoBottom) + 7;
  doc.rect(M, y, CW, 2.2, { fill: ACC });
  y += 11;

  /* ---------- dati intervento (griglia 2 colonne) ---------- */
  const fields = (tpl.headerFields || []).filter(f => f.type !== 'hidden');
  const cw2 = CW / 2;
  for (let i = 0; i < fields.length; i += 2) {
    const pair = fields.slice(i, i + 2);
    const cells = pair.map(f => {
      const lab = doc.wrap(f.label, 'R', 7, cw2 - 14);
      const val = doc.wrap(fmtHeader(f, rep.header[f.id] || '') || '—', 'B', 10, cw2 - 14);
      return { lab, val, h: 6 + lab.length * 8.6 + 3 + val.length * 12.2 + 4 };
    });
    const rh = Math.max(...cells.map(c => c.h));
    if (!room(rh)) newPage();
    cells.forEach((c, k) => {
      const x = M + k * cw2;
      const full = pair.length === 1;
      const w = full ? CW : cw2;
      doc.rect(x, y, w, rh, { stroke: LINE, lw: 0.6 });
      let yy = y + 6;
      for (const l of c.lab) { doc.text(l, x + 7, yy + 6.2, { size: 7, color: INK3 }); yy += 8.6; }
      yy += 3;
      for (const l of c.val) { doc.text(l, x + 7, yy + 9, { f: 'B', size: 10, color: INK }); yy += 12.2; }
    });
    y += rh;
  }
  y += 12;

  /* ---------- riepilogo anomalie ---------- */
  const anomalies = [];
  for (const s of tpl.sections) {
    for (const it of s.items) {
      const v = itemVal(rep, it);
      const aBad = isAlert(it, v.a), pBad = !it.single && isAlert(it, v.p);
      if (aBad || pBad) {
        const parts = [];
        if (it.single) parts.push(displayVal(it, v.a));
        else {
          if (String(v.a || '').trim()) parts.push('arrivo ' + displayVal(it, v.a));
          if (String(v.p || '').trim()) parts.push('partenza ' + displayVal(it, v.p));
        }
        const rt = it.type === 'number' ? rangeText(it) : '';
        anomalies.push((it.num ? it.num + '. ' : '') + it.label + ': ' + parts.join(' · ') + (rt ? '  (rif. ' + rt + ')' : ''));
      }
    }
  }
  if (opts.summary !== false && anomalies.length) {
    const lines = [];
    for (const a of anomalies) {
      const wl = doc.wrap(a, 'R', 8.4, CW - 26);
      wl.forEach((l, k) => lines.push({ t: l, first: k === 0 }));
    }
    const bh = 22 + lines.length * 10.6 + 6;
    if (!room(Math.min(bh, 120))) newPage();
    doc.rect(M, y, CW, bh, { fill: REDBG });
    doc.rect(M, y, 3, bh, { fill: RED });
    doc.text('Valori fuori riferimento / anomalie (' + anomalies.length + ')', M + 12, y + 14, { f: 'B', size: 9, color: RED });
    let yy = y + 22;
    for (const l of lines) {
      if (l.first) doc.rect(M + 13, yy + 3.2, 3, 3, { fill: RED });
      doc.text(l.t, M + 22, yy + 7.8, { size: 8.4, color: INK });
      yy += 10.6;
    }
    y += bh + 12;
  }

  /* ---------- riferimenti alle foto nella colonna note ---------- */
  const photoRefs = {};
  if (opts.includePhotos !== false) {
    (opts.photos || []).forEach((p, i) => {
      if (p.itemId) (photoRefs[p.itemId] = photoRefs[p.itemId] || []).push(i + 1);
    });
  }

  /* ---------- tabelle per categoria ---------- */
  const COLS = [
    { w: 22, key: 'num' }, { w: 152, key: 'label' }, { w: 92, key: 'ref' },
    { w: 74, key: 'a' }, { w: 74, key: 'p' },
  ];
  COLS.push({ w: CW - COLS.reduce((s, c) => s + c.w, 0), key: 'n' });
  const PAD = 4, FS = 7.9, LH = 9.6, VFS = 8.4;

  function colHeader() {
    const heads = ['N.', 'Voce di controllo', 'Riferimento', tpl.colA || 'Arrivo', tpl.colB || 'Partenza', 'Note / dettagli'];
    const wrapped = heads.map((t, i) => doc.wrap(t, 'B', 6.8, COLS[i].w - 2 * PAD));
    const hh = Math.max(...wrapped.map(w => w.length)) * 8.2 + 8;
    let x = M;
    doc.rect(M, y, CW, hh, { fill: '#E9EEF0' });
    wrapped.forEach((ls, i) => {
      let yy = y + 4;
      for (const l of ls) { doc.text(l, x + PAD, yy + 6.2, { f: 'B', size: 6.8, color: INK2 }); yy += 8.2; }
      x += COLS[i].w;
    });
    y += hh;
  }
  function band(title) {
    doc.rect(M, y, CW, 18, { fill: ACC });
    doc.text(title, M + 8, y + 12.4, { f: 'B', size: 9.2, color: '#FFFFFF' });
    y += 18;
  }
  function rowLayout(it) {
    const v = itemVal(rep, it);
    const aBad = isAlert(it, v.a), pBad = !it.single && isAlert(it, v.p);
    let ref = it.ref || '';
    if (!ref && it.type === 'number') ref = rangeText(it);
    const cells = [
      { t: it.num || '', f: 'B', s: FS, c: INK2 },
      { t: it.label, f: 'R', s: FS, c: INK },
      { t: ref, f: 'R', s: 7.4, c: INK2 },
      { t: displayVal(it, v.a), f: 'B', s: VFS, c: aBad ? RED : INK, bad: aBad },
      { t: it.single ? '' : displayVal(it, v.p), f: 'B', s: VFS, c: pBad ? RED : INK, bad: pBad },
      { t: [v.n || '', photoRefs[it.id] ? 'Foto n. ' + photoRefs[it.id].join(', ') : ''].filter(Boolean).join('\n'), f: 'R', s: 7.4, c: INK },
    ];
    const widths = COLS.map(c => c.w);
    if (it.single) { widths[3] = COLS[3].w + COLS[4].w; widths[4] = 0; }
    cells.forEach((c, i) => { c.lines = widths[i] ? doc.wrap(c.t, c.f, c.s, widths[i] - 2 * PAD) : []; c.w = widths[i]; });
    const hgt = Math.max(16, ...cells.map(c => c.lines.length * (c.s + 1.9) + 2 * PAD + 1));
    return { cells, h: hgt };
  }
  function drawRow(r, zebra) {
    if (zebra) doc.rect(M, y, CW, r.h, { fill: ZEBRA });
    let x = M;
    r.cells.forEach(c => {
      if (!c.w) return;
      if (c.bad) doc.rect(x, y, c.w, r.h, { fill: REDBG });
      let yy = y + PAD;
      for (const l of c.lines) { doc.text(l, x + PAD, yy + c.s * 0.86, { f: c.f, size: c.s, color: c.c }); yy += c.s + 1.9; }
      x += c.w;
    });
    // griglia
    doc.line(M, y + r.h, M + CW, y + r.h, LINE, 0.5);
    x = M;
    r.cells.forEach((c, i) => {
      if (i > 0 && c.w) doc.line(x, y, x, y + r.h, LINE, 0.5);
      x += c.w;
    });
    doc.line(M, y, M, y + r.h, LINE, 0.5);
    doc.line(M + CW, y, M + CW, y + r.h, LINE, 0.5);
    y += r.h;
  }

  for (const s of tpl.sections) {
    if (!s.items.length) continue;
    const rows = s.items.map(rowLayout);
    const headH = 18 + 24;
    if (!room(headH + rows[0].h)) newPage();
    band(s.title);
    colHeader();
    rows.forEach((r, i) => {
      if (!room(r.h)) {
        newPage();
        band(s.title + ' (segue)');
        colHeader();
      }
      drawRow(r, i % 2 === 1);
    });
    y += 12;
  }

  /* ---------- note generali ---------- */
  if (String(rep.notes || '').trim()) {
    const lines = doc.wrap(rep.notes, 'R', 9, CW - 20);
    if (!room(18 + 10 + 11.6 * Math.min(lines.length, 3))) newPage();
    band(tpl.notesTitle || 'Note');
    let i = 0;
    while (i < lines.length) {
      const avail = Math.max(1, Math.floor((BOTTOM - y - 14) / 11.6));
      const chunk = lines.slice(i, i + avail);
      const bh = chunk.length * 11.6 + 14;
      doc.rect(M, y, CW, bh, { stroke: LINE, lw: 0.6 });
      let yy = y + 7;
      for (const l of chunk) { doc.text(l, M + 10, yy + 8.6, { size: 9, color: INK }); yy += 11.6; }
      y += bh;
      i += chunk.length;
      if (i < lines.length) { newPage(); band((tpl.notesTitle || 'Note') + ' (segue)'); }
    }
    y += 12;
  }

  /* ---------- documentazione fotografica ---------- */
  const photos = opts.includePhotos === false ? [] : (opts.photos || []);
  if (photos.length) {
    const per = opts.photosPerRow === 1 ? 1 : 2;
    const gap = 12;
    const cellW = (CW - gap * (per - 1)) / per;
    const imgH = per === 1 ? 360 : 196;
    const title = 'Documentazione fotografica (' + photos.length + ')';
    let first = true;
    for (let i = 0; i < photos.length; i += per) {
      const group = photos.slice(i, i + per);
      const capLines = group.map((p, k) => doc.wrap((i + k + 1) + '. ' + (p.caption || 'Foto ' + (i + k + 1)), 'R', 8, cellW).slice(0, 3));
      const rh = imgH + 6 + Math.max(...capLines.map(c => c.length)) * 10 + 12;
      if (!room((first ? 30 : 0) + rh)) { newPage(); band(title + (first ? '' : ' (segue)')); y += 8; first = false; }
      if (first) { band(title); y += 8; first = false; }
      for (let k = 0; k < group.length; k++) {
        const p = group[k];
        const x = M + k * (cellW + gap);
        doc.rect(x, y, cellW, imgH, { fill: '#EEF2F3' });
        try {
          const bytes = new Uint8Array(await p.blob.arrayBuffer());
          const idx = doc.addImage(bytes, p.w, p.h);
          const sc = Math.min(cellW / p.w, imgH / p.h);
          const iw = p.w * sc, ih = p.h * sc;
          doc.image(idx, x + (cellW - iw) / 2, y + (imgH - ih) / 2, iw, ih);
        } catch (e) { /* immagine non leggibile */ }
        let yy = y + imgH + 6;
        for (const l of capLines[k]) { doc.text(l, x, yy + 7.5, { size: 8, color: INK2 }); yy += 10; }
      }
      y += rh;
    }
  }

  /* ---------- piè di pagina ---------- */
  const plant = repPlant(rep), date = fmtDate(repDate(rep)), tech = hdrVal(rep, 'tech');
  const foot = [plant, date, tech].filter(Boolean).join('  ·  ');
  const n = doc.pages.length;
  doc.pages.forEach((p, i) => {
    doc.cur = p;
    doc.line(M, H - 28, W - M, H - 28, LINE, 0.6);
    doc.text(foot, M, H - 17, { size: 7.2, color: INK3 });
    doc.text('Pagina ' + (i + 1) + ' di ' + n, W - M, H - 17, { size: 7.2, color: INK3, align: 'right' });
    if (st.azienda) doc.text(st.azienda, W / 2, H - 17, { size: 7.2, color: INK3, align: 'center' });
  });

  const bytes = await doc.output({ title: fileBase(rep, st), author: tech });
  return { bytes, doc };
}

'use strict';
/* Report Impianti — interfaccia */

const S = {
  templates: [],
  reports: [],
  settings: Object.assign({}, DEFAULT_SETTINGS),
  logo: null,          // {blob,w,h}
  plants: [],          // [{id,name,folder}]
  collapsed: {},       // stato categorie chiuse per report
};
const app = document.getElementById('app');
let objectUrls = [];

/* ================================================================ salvataggio */
const saveQueue = new Map();
function scheduleSave(store, obj, ms) {
  const key = store + ':' + obj.id;
  const ex = saveQueue.get(key);
  if (ex) clearTimeout(ex.t);
  const t = setTimeout(() => { saveQueue.delete(key); doSave(store, obj); }, ms == null ? 350 : ms);
  saveQueue.set(key, { t, store, obj });
}
async function doSave(store, obj) {
  try {
    await DB.put(store, obj);
    const ind = document.querySelector('.saved');
    if (ind) { ind.textContent = '✓ Salvato'; ind.style.opacity = '.8'; }
  } catch (e) {
    toast('Errore di salvataggio: ' + e.message);
  }
}
function flushSaves() {
  for (const [key, v] of saveQueue) { clearTimeout(v.t); saveQueue.delete(key); doSave(v.store, v.obj); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSaves(); });
window.addEventListener('pagehide', flushSaves);

/* ================================================================ router */
let curPath = '/';
function go(path, fromPop) {
  curPath = path || '/';
  if (!fromPop && !Native.isApp) { try { history.pushState({ p: curPath }, ''); } catch (e) { /* non disponibile */ } }
  render();
}
window.addEventListener('popstate', e => {
  if (closeTopLayer()) { try { history.pushState({ p: curPath }, ''); } catch (x) { /* ignora */ } return; }
  go((e.state && e.state.p) || '/', true);
});
function parts() { return curPath.split('/').filter(Boolean).map(decodeURIComponent); }
function parentRoute() {
  const p = parts();
  if (!p.length) return null;
  if (p[0] === 'r' && p[2] === 'struttura') return '/r/' + encodeURIComponent(p[1]);
  if (p.length >= 2) return p[0] === 'r' ? '/' : '/' + p[0];
  return '/';
}
window.onAndroidBack = () => {
  if (closeTopLayer()) return true;
  const pr = parentRoute();
  if (pr) { go(pr); return true; }
  return false;
};
let lastRoute = '';
function render() {
  flushSaves();
  for (const u of objectUrls) URL.revokeObjectURL(u);
  objectUrls = [];
  const p = parts();
  const routeKey = p.join('/');
  app.innerHTML = '';
  let v;
  if (!p.length) v = viewHome();
  else if (p[0] === 'r' && p[2] === 'struttura') v = viewStructure('rep', p[1]);
  else if (p[0] === 'r') v = viewReport(p[1]);
  else if (p[0] === 't' && p[1]) v = viewStructure('tpl', p[1]);
  else if (p[0] === 't') v = viewTemplates();
  else if (p[0] === 'p' && p[1]) v = viewPlant(p[1]);
  else if (p[0] === 'p') v = viewPlants();
  else if (p[0] === 's') v = viewSettings();
  else v = viewHome();
  if (v) add(app, [v]);
  if (routeKey !== lastRoute) window.scrollTo(0, 0);
  lastRoute = routeKey;
}

function bottomNav(active) {

function field(label, input) { return h('label', { class: 'fld' }, h('span', null, label), input); }
function group(label, el) { return h('div', { class: 'fld' }, h('span', null, label), el); }
function plantsList() {
  const m = new Map();
  for (const p of S.plants) m.set(norm(p.name), { name: p.name, plant: p, reports: [] });
  for (const r of S.reports) {
    const n = repPlant(r);
    if (!n) continue;
    const k = norm(n);
    if (!m.has(k)) m.set(k, { name: n, plant: null, reports: [] });
    m.get(k).reports.push(r);
  }
  for (const v of m.values()) v.reports.sort(byDateDesc);
  return Array.from(m.values()).sort((a, b) => {
    const da = a.reports[0] ? repDate(a.reports[0]) : '', db = b.reports[0] ? repDate(b.reports[0]) : '';
    return db.localeCompare(da) || a.name.localeCompare(b.name);
  });
}
function byDateDesc(a, b) {
  const d = repDate(b).localeCompare(repDate(a));
  return d || (b.createdAt || 0) - (a.createdAt || 0);
}
function findPrevious(rep) {
  const plant = norm(repPlant(rep));

  const d = repDate(rep);
  const cands = S.reports.filter(r => r.id !== rep.id && norm(repPlant(r)) === plant &&
    (repDate(r) < d || (repDate(r) === d && (r.createdAt || 0) < (rep.createdAt || 0))));
  cands.sort(byDateDesc);
  return cands.find(r => r.templateId === rep.templateId) || cands[0] || null;
}
function lastForPlant(plant, tplId) {
  const k = norm(plant);
  if (!k) return null;
  const c = S.reports.filter(r => norm(repPlant(r)) === k).sort(byDateDesc);
  return c.find(r => r.templateId === tplId) || c[0] || null;
}
function avatarDate(iso) {

}

async function deleteReport(r) {

/* ================================================================ NUOVO REPORT */
function newReportSheet(o) {
  o = o || {};
  if (!S.templates.length) { toast('Crea prima un modello'); return; }
  sheet(s => {
    const lastTpl = (o.from && o.from.templateId) || S.settings.lastTemplate;
    let tpl = S.templates.find(t => t.id === lastTpl) || S.templates[0];
    const tplSel = h('select', { class: 'in', id: 'nr-tpl' }, S.templates.map(t => h('option', { value: t.id }, t.name)));
    tplSel.value = tpl.id;
    const plantIn = h('input', { class: 'in', id: 'nr-plant', value: o.plant || '', placeholder: 'Cerca o scrivi un nuovo impianto', autocomplete: 'off' });
    const plantBox = h('div', { class: 'plant-pick' });
    const dateIn = h('input', { class: 'in', id: 'nr-date', type: 'date', value: todayISO() });
    const prevBox = h('div');
    const opt = { struct: true, header: true, notes: true, general: true };
    let prev = null;
    const paintPlants = () => {
      plantBox.innerHTML = '';
      const q = norm(plantIn.value);
      const list = plantsList();
      const exact = list.some(p => norm(p.name) === q);
      const shown = list.filter(p => !q || norm(p.name).includes(q)).slice(0, 8);
      for (const p of shown) {
        const on = norm(p.name) === q;
        plantBox.appendChild(h('button', {
          class: 'chip' + (on ? ' on' : ''), onclick: () => { plantIn.value = p.name; refresh(); },
        }, on ? icon('check', 'sm') : icon('factory', 'sm'), p.name));
      }
      if (q && !exact) {
        plantBox.appendChild(h('div', { class: 'small', style: { width: '100%', color: 'var(--pri)', marginTop: '2px' } },
          icon('plus', 'sm'), ' Nuovo impianto: verrà aggiunto all\'elenco'));
      }
    };
    const refresh = () => {
      tpl = S.templates.find(t => t.id === tplSel.value) || tpl;
      paintPlants();
      prev = o.from && norm(repPlant(o.from)) === norm(plantIn.value) ? o.from : lastForPlant(plantIn.value, tpl.id);
      prevBox.innerHTML = '';
      if (!prev) return;
      const ck = (k, label) => h('label', { class: 'chk' }, h('input', {
        type: 'checkbox', checked: opt[k], onchange: e => { opt[k] = e.target.checked; },
      }), h('span', null, label));
      prevBox.appendChild(h('div', { class: 'card', style: { boxShadow: 'none', border: '1.5px solid var(--line)', marginTop: '14px' } },
        h('div', { class: 'card-b', style: { paddingTop: '12px' } },
          h('div', { style: { fontWeight: 600 } }, 'Parti dall\'ultimo intervento del ' + fmtDate(repDate(prev))),
          h('div', { class: 'small muted' }, 'I valori registrati allora verranno mostrati accanto a ogni voce come riferimento.'),
          ck('struct', 'Mantieni la stessa struttura (voci aggiunte/tolte per questo impianto)'),
          ck('header', 'Copia i dati dell\'impianto (tipologia torre, …)'),
          ck('notes', 'Copia le note delle singole voci'),
          ck('general', 'Copia le note generali (da aggiornare)'))));
    };
    tplSel.addEventListener('change', refresh);
    plantIn.addEventListener('input', refresh);
    refresh();
    return [
      h('h2', null, 'Nuovo report'),
      S.templates.length > 1 ? field('Modello di checklist', tplSel) : null,
      field('Impianto', plantIn), plantBox,
      field('Data intervento', dateIn),
      prevBox,
      h('div', { class: 'btns' },
        h('button', { class: 'btn', onclick: () => s.close() }, 'Annulla'),
        h('button', {
          class: 'btn pri', onclick: async () => {
            const name = plantIn.value.trim();
            if (!name) { toast('Scegli o scrivi l\'impianto'); plantIn.focus(); return; }
            const r = await ensurePlant(name);
            const rep = await createReport(tpl, r.p.name, dateIn.value, prev, opt);
            s.close();
            if (r.isNew) toast('«' + r.p.name + '» aggiunto all\'elenco impianti');
            go('/r/' + encodeURIComponent(rep.id));
          },
        }, icon('check'), 'Crea')),
    ];
  });
}

/* ---------- elenco impianti ---------- */
function plantByName(name) { return S.plants.find(p => norm(p.name) === norm(name)); }
async function ensurePlant(name) {
  name = String(name || '').trim();
  if (!name) return { p: null, isNew: false };
  let p = plantByName(name);
  if (p) return { p, isNew: false };
  p = { id: 'pl' + uid(), name, folder: name, createdAt: Date.now() };
  S.plants.push(p);
  await DB.setSetting('plants', S.plants);
  return { p, isNew: true };
}
function spName(s) {
  return String(s || '').normalize('NFC').replace(/[\\/:*?"<>|#%\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '').replace(/^~\$?/, '').slice(0, 100) || 'Senza nome';
}
function plantFolder(name) {
  const p = plantByName(name);
  return spName((p && p.folder) || name || 'Impianto');
}
function dateFolders(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || todayISO()) || /^(\d{4})-(\d{2})-(\d{2})/.exec(todayISO());
  return [m[1], m[2] + ' - ' + MONTHS[+m[2] - 1], m[3]];
}
function reportFolder(rep) {
  return [plantFolder(repPlant(rep))].concat(dateFolders(repDate(rep))).join('/');
}
async function createReport(tpl, plant, date, prev, opt) {
  const struct = prev && opt.struct ? clone(prev.tpl) : clone(tpl);
  delete struct.createdAt; delete struct.updatedAt;
  const rep = {
    id: 'r' + uid(), templateId: tpl.id, tpl: struct, header: {}, values: {}, notes: '', photos: [],
    createdAt: Date.now(), updatedAt: Date.now(),
  };
  for (const f of struct.headerFields) {
    let v = '';
    if (f.role === 'plant') v = plant;
    else if (f.role === 'date') v = date || todayISO();
    else if (f.role === 'tech') v = S.settings.tecnico || (prev ? prev.header[f.id] || '' : '');
    else if (f.def === 'today') v = todayISO();
    else if (f.def === 'now') v = nowHM();
    else v = f.def || '';
    if (prev && opt.header && prev.header[f.id] && (f.role === 'keep' || (f.role === '' && (f.type === 'text' || f.type === 'choice')))) v = prev.header[f.id];
    rep.header[f.id] = v;
  }
  if (prev && opt.notes) {
    for (const s of struct.sections) for (const it of s.items) {
      const pv = prev.values[it.id];
      if (pv && pv.n) rep.values[it.id] = { a: '', p: '', n: pv.n };
    }
  }
  if (prev && opt.general) rep.notes = prev.notes || '';
  S.reports.push(rep);
  await DB.put('reports', rep);
  S.settings.lastTemplate = tpl.id;
  DB.setSetting('lastTemplate', tpl.id);
  return rep;
}

/* ================================================================ REPORT */
function viewReport(id) {
  const rep = S.reports.find(r => r.id === id);
  if (!rep) { setTimeout(() => go('/'), 0); return null; }
  const tpl = rep.tpl;
  const prev = findPrevious(rep);
  const collapsed = S.collapsed[rep.id] || (S.collapsed[rep.id] = {});
  const save = () => { rep.updatedAt = Date.now(); scheduleSave('reports', rep); refreshTop(); };

  const subEl = h('small');
  const titleEl = h('b');
  const progress = h('i');
  const summary = h('div', { class: 'summary' });
  const tabDots = {};
  const secCounts = {};
  function refreshTop() {
    const st = repStats(rep);
    titleEl.textContent = repPlant(rep) || 'Nuovo report';
    subEl.textContent = [fmtDate(repDate(rep)), tpl.name].filter(Boolean).join(' · ');
    progress.style.width = (st.total ? Math.round(st.done / st.total * 100) : 0) + '%';
    summary.innerHTML = '';
    add(summary, [
      h('span', { class: 'bdg' + (st.done === st.total ? ' green' : '') }, icon('check'), st.done + ' di ' + st.total + ' voci compilate'),
      st.alerts ? h('span', { class: 'bdg red' }, icon('alert'), st.alerts + (st.alerts === 1 ? ' anomalia' : ' anomalie')) : null,
      prev ? h('span', { class: 'bdg' }, 'Precedente: ' + fmtDate(repDate(prev))) : null,
    ]);
    for (const s of tpl.sections) {
      const ss = st.secs[s.id];
      if (tabDots[s.id]) tabDots[s.id].className = 'dot' + (ss.alerts ? ' alert' : ss.done === ss.total && ss.total ? ' full' : '');
      if (secCounts[s.id]) secCounts[s.id].textContent = ss.done + '/' + ss.total;
    }
  }

  const topBar = h('div', { class: 'bar has-back' },
    h('button', { class: 'ib', onclick: () => go('/') }, icon('back')),
    h('div', { class: 'ttl' }, titleEl, subEl),
    h('span', { class: 'saved' }),
    h('button', { class: 'ib', onclick: () => moreMenu() }, icon('more')));

  function moreMenu() {
    const base = S.templates.find(t => t.id === rep.templateId);
    menu('Report', [
      { icon: 'pdf', label: 'Genera PDF / JPEG', do: () => exportSheet(rep) },
      { icon: 'layers', label: 'Modifica voci e categorie di questo report', do: () => go('/r/' + encodeURIComponent(rep.id) + '/struttura') },
      base ? { icon: 'refresh', label: 'Aggiorna struttura dal modello «' + base.name + '»', do: () => syncFromTemplate(rep, base) } : null,
      { icon: 'check', label: 'Copia arrivo → partenza (tutti i campi vuoti)', do: () => { copyAll(rep, null); render(); toast('Valori copiati'); } },
      { icon: 'dup', label: 'Nuovo intervento partendo da questo', do: () => newReportSheet({ plant: repPlant(rep), from: rep }) },
      { icon: 'trash', label: 'Elimina report', red: true, do: () => deleteReport(rep) },
    ]);
  }

  /* --- schede di navigazione --- */
  const page = h('div', { class: 'page' });
  const tabs = h('div', { class: 'tabs' });
  const jump = el => {
    const y = el.getBoundingClientRect().top + window.scrollY - 112;
    window.scrollTo({ top: y, behavior: 'smooth' });
  };

  /* --- dati intervento --- */
  const infoCard = h('div', { class: 'card', id: 'sec-info' });
  {
    const dls = [];
    const body = h('div', { class: 'card-b grid2' });
    for (const f of tpl.headerFields) {
      let inp;
      const val = rep.header[f.id] || '';

      else if (f.type === 'time') inp = h('input', { class: 'in', type: 'time', value: val });

        dls.push(h('datalist', { id: dlId }, opts.map(o => h('option', { value: o }))));
        inp = h('input', { class: 'in', list: dlId, value: val, autocomplete: 'off' });

      if (f.role === 'plant') inp.addEventListener('change', async () => { const r = await ensurePlant(inp.value); if (r.isNew) toast('«' + r.p.name + '» aggiunto all\'elenco impianti'); });

    const body = h('div', { class: 'card-b' });

    for (const it of s.items) body.appendChild(itemEl(rep, it, prev, save));
    card.append(hd, body);
    page.appendChild(card);
    const dot = h('span', { class: 'dot' });

    tabs.appendChild(h('button', { onclick: () => { card.classList.remove('collapsed'); collapsed[s.id] = false; jump(card); } }, dot, shortTitle(s.title)));
  }
  function sectionMenu(s) {
    menu(s.title, [
      { icon: 'check', label: 'Copia arrivo → partenza (campi vuoti)', do: () => { copyAll(rep, s); render(); toast('Valori copiati'); } },
      { icon: 'layers', label: 'Modifica voci di questa categoria', do: () => go('/r/' + encodeURIComponent(rep.id) + '/struttura') },
    ]);
  }

  /* --- foto --- */

  page.appendChild(photoCard);
  tabs.appendChild(h('button', { onclick: () => jump(photoCard) }, icon('camera', 'sm'), 'Foto'));

  /* --- note generali --- */
  const notes = autosize(h('textarea', { class: 'in', placeholder: 'Funzionamento, interventi eseguiti, segnalazioni…', value: rep.notes || '' }));

    class: 'btn ghost', style: { padding: '0', minHeight: '36px', marginTop: '6px' },
    onclick: () => {
      sheet(s2 => [h('h2', null, 'Note del ' + fmtDate(repDate(prev))), h('div', { style: { whiteSpace: 'pre-wrap', marginTop: '10px', fontSize: '14.5px' } }, prev.notes),
        h('div', { class: 'btns' }, h('button', { class: 'btn', onclick: () => s2.close() }, 'Chiudi'),

  return [
